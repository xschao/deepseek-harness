# my_config/web/cordis.patch.yml — 项目的 DSH web profile 配置补丁层（随 git 管理）。
# 关键插件配置都固化在这里；凭据与账号等敏感值仍留在 ~/.dsh/.credentials.yaml。
# 修改后执行 dsh-restart 并刷新页面生效。
#
# 变更记录（未提交改动，按时间倒序；只记会影响运行行为的项）：
#   2026-11-15  agent-default-model 新增 reasoningEffort: high —— 默认 Agent 用高强度推理，
#               首字延迟与 token 消耗上升；dsh-restart 后生效，回落到 medium 即恢复。
# 下面每个字段上方的注释说明"这项配置的作用"，不承担变更历史。
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

# IMA 知识库 MCP（工具层问答，供 Agent 调用）。
# 为什么不写死路径：command 用 process.execPath（即运行 DSH 的那个 node），
# args[0] 由 DSH_HOME 推出，全部是 !!js 表达式，换机器、换用户名、换 node 版本都不用改这份配置。
- insert:
    - id: mcp-ima-kb
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        # 工具名前缀：模型侧看到的是 mcp__ima__* 这一组工具
        serverName: ima
        # 本地子进程通信（stdin/stdout + JSON-RPC），不额外监听端口
        transport: stdio
        # 用当前运行 DSH 的 node，避免 PATH 里另一个 node 版本导致原生模块 ABI 不匹配
        command: !!js process.execPath
        # MCP server 脚本路径 = <DSH_HOME>/profiles/web/node_modules/@deepseek-ai/dsh-ima-kb/tools/ima-mcp-server.mjs
        # DSH_HOME 未设置时回落 ~/.dsh（Windows 即 %USERPROFILE%\.dsh）；
        # 插件装在 web profile 的 node_modules 下，所以路径里带 profiles/web 这一段。
        args:
          - !!js (process.env.DSH_HOME || ((process.env.USERPROFILE || process.env.HOME) + '/.dsh')) + '/profiles/web/node_modules/@deepseek-ai/dsh-ima-kb/tools/ima-mcp-server.mjs'
        # 继承 DSH 的工作目录（F:\AITools\deepseek），让 MCP 侧解析相对路径时与主进程一致
        cwd: !!js process.cwd()
        # 4 分钟：IMA 问答/上传要过网络和云端解析，超时设短会把正常调用判成失败
        toolCallTimeoutMs: 240000
        # MCP 起不来时只让这批工具不可用，不拖垮整个 web profile
        failOnStartupError: false

# IMA 知识库侧边栏插件（junction 指向 plugins/ima-kb）。
- id: ima-kb
  name: '@deepseek-ai/dsh-ima-kb'
  config:
    robotType: 5
    requestTimeoutMs: 300000
    maxUploadBytes: 26214400
    askIntervalMs: 4000
    askCooldownMs: 3000
    askMaxPerMinute: 10

# 技能发现根：本仓库 .claude 下的本地 skill（含 dsh-extension）。
# 必须指向父目录：provider 在每个根下按 <name>/SKILL.md 找条目，
# 指到 .claude/dsh-extension 会扫到 0 个技能且不报错。
- id: skill-filesystem
  config:
    customSkillDirs:
      - 'F:/AITools/deepseek/deepseek-harness-master/.claude'

# 默认 Agent 模型（deepseek-official 走 DEEPSEEK_API_KEY，凭据在 ~/.dsh/.credentials.yaml）。
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-account
    model: deepseek-flash
    # 默认 Agent 的推理强度：high 让 deepseek-flash 在复杂改造/排查时多想几步，
    # 代价是首字延迟变长、token 消耗增加；日常问答想省钱可降到 medium。
    reasoningEffort: high

# ── 融资租赁专家 preset ───────────────────────────────────────────────────────
# 与 shipped 的 `standard` 同构，但：①persona 换成融资租赁专家；②砍掉 plan-mode、
# 委派/subagent、plugin-manager 行以压缩每轮固定 token；③agent-instructions 关闭，
# 避免把 harness 仓库的 AGENTS.md 灌进业务问答。
# 组合来源：C:\Users\19227\.dsh\app\node_modules\@deepseek-ai\dsh-web-app\presets\standard.patch.yml
# 升级提醒：若 shipped standard 新增工具行，需要在这里手工补一行（自建 preset 不继承）。
- insert:
    - id: preset-leasing
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: leasing
        name: 融资租赁专家
        description: Leaf/HAP 4.2 融租易后台逻辑问答，带独立知识库与增量归档
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是「融资租赁专家」，服务对象是本项目的实施与开发人员，专精 Leaf/HAP 4.2 融租易（HLS01）的后台业务逻辑：单据流、数据模型、现金事务与核销、发票与凭证、期间计提、配置引擎。

                工作方式：
                1. 回答前先读知识库索引 F:\AITools\deepseek\leasing-kb\INDEX.md，再按索引只打开 1–2 个最相关的主题文件；不要一次读完整个知识库，也不要跳过索引直接猜。
                2. 结论先行：先一句话给答案，再列依据（表名.字段名、单据状态、计算公式）。依据必须来自知识库、原始 PDF、数据库表结构或代码，不得凭印象补细节。
                3. 知识库没覆盖的，直接说「知识库还没有这块」，并指出 INDEX「已知信息缺口」里对应的条目；不要编字段名、状态值、金额口径。
                4. 文档自相矛盾时（例如 cf_item 取值前后不一致），并列两种说法 + 各自出处，让用户裁定，不要自己挑一个。
                5. 中文回答；表名、字段名、syscode、状态值保留系统原名，不翻译。
                6. 需要实时数据时用 dameng-db / plsql 技能查库；需要原始资料时读 E:\Desktop\小松项目学习笔记 下的文档。取数或查证得到的新结论要写回知识库。

                知识迭代（用户会持续喂材料）：
                - 新材料的默认落点是 F:\AITools\deepseek\leasing-kb\_inbox\。
                - 归档流程：读材料 → 判断并入已有主题还是新开主题 → 改对应 md → 更新 INDEX.md 的主题表（来源 + 日期）与变更记录 → 告诉用户改了哪几个文件、新增了什么结论、置信度多少（A/B/C）。
                - 与旧结论冲突时保留旧结论并标「已废弃：见 <新依据>」，不要悄悄覆盖。
                - 只在用户明确要求时改 preset 自身；改完要提示需要重启 DSH 才生效。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              # 保留本机既有技能根（dameng-db / plsql / leaf-* 等都在 .claude 下）
              customSkillDirs:
                - 'F:/AITools/deepseek/deepseek-harness-master/.claude'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
